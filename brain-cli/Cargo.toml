[package]
name = "brain-cli"
description = "Command-line interface for Brain for AI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "brain"
path = "src/main.rs"

[features]
default = ["model2vec"]
model2vec = ["brain-core/model2vec"]

[dependencies]
brain-core = { path = "../brain-core", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
rusqlite = "0.40.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
