name: Linux and unsigned macOS release artifacts (build only)
'on':
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          # Install rust-toolchain.toml's components up front: a lazy rustup install
          # during the build collided on bin/cargo-fmt in the x86_64 job.
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - name: Check tag matches package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install pinned Zig in runner environment
        run: python3 -m pip install --disable-pip-version-check ziglang==0.15.1
      - name: Build static artifact and checksums
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          RELEASE_OUT: ${{ runner.temp }}/dist
        shell: bash
        run: |
          export ZIG="$(python3 -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent / "zig")')"
          packaging/build-release.sh "$TARGET"
          (cd "$RELEASE_OUT" && sha256sum --check SHA256SUMS)
      - name: Native smoke test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          binary=$(find "$RUNNER_TEMP/dist" -maxdepth 1 -type f -name 'brain-*-musl')
          export HOME="$(mktemp -d)"
          export BRAIN_HOME="$HOME/.brain" BRAIN_MODELS_DIR="$HOME/models"
          "$binary" --version
          "$binary" --offline init
          "$binary" --offline remember 'release smoke marker' --kind fact
          "$binary" --offline ask 'release smoke marker' --no-archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brain-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14
# Deliberately no release publication. Each matrix artifact has its own SHA256SUMS.
# When publishing later, combine all target manifests into the release's SHA256SUMS.

  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check tag matches package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build native unsigned Mach-O and checksum
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          RELEASE_OUT: ${{ runner.temp }}/dist
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          /bin/bash packaging/build-macos.sh "$TARGET"
          (cd "$RELEASE_OUT" && shasum -a 256 --check SHA256SUMS)
      - name: Native smoke test with synthetic HOME
        shell: bash
        run: |
          binary=$(find "$RUNNER_TEMP/dist" -maxdepth 1 -type f -name 'brain-*-apple-darwin')
          export HOME="$(mktemp -d)"
          export BRAIN_HOME="$HOME/.brain" BRAIN_MODELS_DIR="$HOME/models"
          "$binary" --version
          "$binary" --offline init
          "$binary" --offline remember 'release Darwin smoke marker' --kind fact
          "$binary" --offline ask 'release Darwin smoke marker' --no-archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brain-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14
